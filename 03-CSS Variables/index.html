<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Variables</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="assets/favicon.ico">
</head>

<body>

  <h2>Update CSS Variables with <span class='highlight'>JS</span></h2>

  <div class="controls">

    <button id="reset">Reset to Default</button>

    <br>

    <label for="spacing">Spacing:</label>
    <input id="spacing" type="range" name="spacing" min="10" max="200" value="10" data-sizing="px">

    <label for="blur">Blur:</label>
    <input id="blur" type="range" name="blur" min="0" max="25" value="0" data-sizing="px">

    <label for="base-color">Base Color</label>
    <input id="base-color" type="color" name="base-color" value="#ffc600">

    <label for="brightness">Brightness:</label>
    <input id="brightness" type="range" name="brightness" min="0" max="200" value="100" data-sizing="%">

    <label for="saturate">Saturate:</label>
    <input id="saturate" type="range" name="saturate" min="0" max="200" value="100" data-sizing="%">

    <label for="hue">Hue-Rotate:</label>
    <input id="hue" type="range" name="hue" min="0" max="360" value="0" data-sizing="deg">

  </div>

  <img src="https://i.ibb.co/W4D1p7RN/nature-wallpaper.jpg" alt="nature-wallpaper">

  <script src="script.js"></script>
</body>

</html>
